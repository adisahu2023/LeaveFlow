spring.application.name=LeaveFlow

# Load local environment variables from .env when present.
# On deployment, configure these as environment variables in the hosting provider.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Database configuration (values come from .env locally or host environment variables)
spring.datasource.url=${MYSQL_PUBLIC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT signing secret: Base64-encoded key, at least 256 bits for HS256
jwt.secret=${JWT_SECRET}

# Frontend origin for CORS; override in production.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.web.error.include-message=always
