spring.application.name=LeaveFlow

# Load local environment variables from .env when present.
# On deployment, configure these as environment variables in the hosting provider.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Database configuration (values come from .env locally or host environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT signing secret: Base64-encoded key, at least 256 bits for HS256
jwt.secret=${JWT_SECRET}

# Frontend origin for CORS; override in production.
app.frontend-url=${FRONTEND_URL:https://leavwf.netlify.app}
spring.web.error.include-message=always


#Oauth github

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email



